# Frink web mode on a single machine (OrbStack / Docker).
#   FRINK_WEB_ENV_FILE=~/.config/frink-web/env docker compose -f deploy/web/compose.yml up -d
# The env file holds FRINK_WEB_PASSWORD (or FRINK_WEB_PASSWORD_HASH) and FRINK_WEB_ORIGINS.
name: frink-web
services:
  frink:
    image: frink-web:dev
    container_name: frink
    hostname: frink
    init: false
    # Volumes here already belong to frink, so skip the root ownership handoff.
    user: '501:20'
    restart: unless-stopped
    env_file:
      - ${FRINK_WEB_ENV_FILE:?set FRINK_WEB_ENV_FILE to the env file path}
    environment:
      TZ: America/Denver
      FRINK_WEB_PORT: '8080'
      FRINK_WEB_ROOTS: /workspace
    ports:
      # Loopback only: reachable from this Mac, not the LAN. Public access goes through a TLS proxy.
      - '127.0.0.1:3010:8080'
    volumes:
      - frink-home:/home/frink
      - ${FRINK_WORKSPACE:-./workspace}:/workspace
    shm_size: 1gb
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      dev.orbstack.domains: frink.orb.local
volumes:
  frink-home:
