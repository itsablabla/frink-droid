name: Web image

# Builds the browser-served Frink image (deploy/web) and pushes it to GHCR.
on:
  push:
    branches: [web-mode]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (electron-vite)
        run: bun run build:skills && bunx electron-vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/frink-web:${{ inputs.tag || 'latest' }}
            ghcr.io/${{ github.repository_owner }}/frink-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
